<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap');
      .title { font-family: 'Space Grotesk', sans-serif; font-weight: 700; fill: #ffffff; }
      .subtitle { font-family: 'Space Grotesk', sans-serif; font-weight: 300; fill: rgba(255,255,255,0.5); }
      .url { font-family: 'Space Grotesk', sans-serif; font-weight: 400; fill: rgba(255,255,255,0.3); }
    </style>
    <linearGradient id="grid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.03)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.01)"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0a0a"/>

  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="gridPattern" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#gridPattern)"/>

  <!-- Decorative accent line -->
  <line x1="120" y1="220" x2="320" y2="220" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <!-- Name -->
  <text x="120" y="290" class="title" font-size="72">EXAU EYANO</text>

  <!-- Subtitle -->
  <text x="120" y="350" class="subtitle" font-size="28" letter-spacing="3">GRAPHIC DESIGNER · UI/UX · FULLSTACK DEV</text>

  <!-- Tagline -->
  <text x="120" y="420" class="subtitle" font-size="20" fill="rgba(255,255,255,0.35)">Nous créons des expériences numériques qui marquent.</text>

  <!-- URL -->
  <text x="120" y="560" class="url" font-size="18" letter-spacing="2">KREA14.VERCEL.APP</text>

  <!-- Right decorative element -->
  <rect x="1050" y="180" width="1" height="280" fill="rgba(255,255,255,0.08)"/>

  <!-- Logo mark (simplified "4" shape) -->
  <g transform="translate(1080, 320) scale(1.5)">
    <path d="M315.72,88.57V27.49c-.74-5.5-5.05-9.88-10.48-10.62h-3.45l-9.95-.05h-19.84l-7.76-15.45h37.55l3.33.13c3.7.25,7.26,1.25,10.48,2.88,5.41,2.75,9.85,7.24,12.44,12.74.86,1.87,1.6,3.86,2.1,5.87s.74,4.13.74,6.38l.25,59.21h-15.41Z" fill="rgba(255,255,255,0.08)"/>
    <path d="M425.03,0v87.44h-15.4v-35.97h-45.47c-4.19,0-8.13-1-11.58-2.87-8.26-4.25-13.8-12.87-13.8-22.86V0h15.4v25.73c0,5.62,4.56,10.24,10.1,10.24h45.47V0h15.28Z" fill="rgba(255,255,255,0.08)"/>
  </g>
</svg>